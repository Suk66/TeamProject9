<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { font-family: "Merriweather", serif; }
    .mytitle { height: 200px; color: white; display: flex; align-items: center; justify-content: center; background-color: #343a40; }
    .mypostingbox { width: 60%; margin: 30px auto; padding: 20px; box-shadow: 0px 0px 5px 0px gray; border-radius: 5px; }
  </style>
</head>
<body>

<div class="mytitle">
  <h1>게시글 상세</h1>
</div>

<div class="mypostingbox">
  <h2 th:text="${board.title}"></h2>
  <p><strong>작성자:</strong> <span th:text="${board.writer}"></span></p>
  <p><strong>작성일:</strong> <span th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
  <hr>
  <p th:text="${board.content}"></p>
  <hr>
  <a href="/board" class="btn btn-outline-dark">목록으로</a>
  <!-- 수정 & 삭제 버튼 추가 -->

  <!-- 로그인한 사용자가 본인의 글을 수정하는 경우 -->
<a th:if="${session.user != null and session.user == board.writer}"
   th:href="@{/board/edit/{id}(id=${board.boardId})}"
   class="btn btn-warning">
    수정
</a>

<!-- 로그인 사용자가 다른 사람의 글을 수정하는 경우 & 비로그인 사용자는 비밀번호 입력 필요 -->
<a th:unless="${session.user != null and session.user == board.writer}"
   th:href="@{/board/check-password/{id}(id=${board.boardId})}"
   class="btn btn-warning">
    수정
</a>


  <button class="btn btn-danger" th:attr="onclick='deleteBoard(' + ${board.boardId} + ')'" >삭제</button>

</div>

<tr th:each="board : ${boards}">
    <td th:text="${board.boardId}"></td>  <!-- ✅ 이 값이 0으로 나오는지 확인 -->
    <td>
        <a th:href="@{/board/edit/{id}(id=${board.boardId})}" class="btn btn-warning">
            수정 (ID: <span th:text="${board.boardId}"></span>)
        </a>
    </td>
</tr>

<p>📌 게시글 ID 확인: <span th:text="${board.boardId}"></span></p>

<p>로그인된 사용자: <span th:text="${session.user}"></span></p>


<script>
    function deleteBoard(boardId) {
    console.log("📌 [디버깅] 삭제 요청 ID:", boardId);  // ✅ 삭제 요청 ID 출력

    if (confirm("정말 삭제하시겠습니까?")) {
        fetch(`/board/delete/${boardId}`, { method: "POST" })  // ✅ fetch 요청
            .then(response => {
                console.log("📌 [디버깅] 서버 응답 상태:", response.status);  // ✅ 응답 상태 확인
                if (!response.ok) {
                    throw new Error("삭제 요청 실패!");
                }
                return response.text();
            })
            .then(() => {
                alert("게시글이 삭제되었습니다.");  // ✅ 삭제 성공 알림
                window.location.href = "/board";  // ✅ 목록으로 이동
            })
            .catch(error => {
                console.error("❌ [오류] 삭제 요청 실패:", error);
                alert("삭제 실패! 다시 시도하세요.");
            });
    }
}

</script>


</body>
</html>
